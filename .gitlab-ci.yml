default:
  tags:
    - runner:main

stages:
  - test

test_java_script:
  image: adoptopenjdk/openjdk11:latest
  stage: test
  cache: []
  script:
    - |
      bash <<'BASH'
      # script.sh reads variables that may be unset, so no nounset.
      set -eo pipefail
      LANGUAGES="java" SERVICE="my-service" API_KEY="dummy" JAVA_INSTRUMENTED_BUILD_SYSTEM="all" source <(cat script.sh)
      export LOG_FILE="java-output.log"
      export TRACER_INIT_LOG="CI Visibility settings"
      java -version 2>&1 | tee "$LOG_FILE"
      grep -q "$TRACER_INIT_LOG" "$LOG_FILE" || { echo "Error: Output does not contain tracer initialisation log: $TRACER_INIT_LOG"; exit 1; }
      BASH

# Each job sources script.sh for Go in the job's shell, as the README shows,
# and runs go test in the next commands against a local stand-in for the
# intake: see tests/go-smoke.sh. The intake needs Python.
.go_smoke_test:
  stage: test
  cache: []
  before_script:
    - sh tests/prepare-container.sh
    - go version
  script:
    - bash tests/go-smoke.sh

test_go_default:
  extends: .go_smoke_test
  image: golang:1.25
  variables:
    EXPECT_GO: instrumented
    EXPECT_DDTEST_VERSION: latest

test_go_latest_image:
  extends: .go_smoke_test
  image: golang:1
  variables:
    EXPECT_GO: instrumented
    EXPECT_DDTEST_VERSION: latest

# BusyBox's wget and sha256sum download and check ddtest.
test_go_alpine:
  extends: .go_smoke_test
  image: golang:1.25-alpine
  variables:
    EXPECT_GO: instrumented
    EXPECT_DDTEST_VERSION: latest

test_go_pinned_version:
  extends: .go_smoke_test
  image: golang:1.25
  variables:
    GO_TRACER_VERSION: v1.16.0
    EXPECT_GO: instrumented
    EXPECT_DDTEST_VERSION: v1.16.0

# An Orchestrion version names no ddtest release: the latest is installed.
test_go_orchestrion_pin:
  extends: .go_smoke_test
  image: golang:1.25
  variables:
    GO_TRACER_VERSION: v1.8.0
    EXPECT_GO: instrumented
    EXPECT_DDTEST_VERSION: latest
    EXPECT_STDERR: "Warning: DD_SET_TRACER_VERSION_GO=v1.8.0 is not a ddtest release"

# Two modules below the root, with the deprecated variables set.
test_go_multiple_modules_deprecated_variables:
  extends: .go_smoke_test
  image: golang:1.25
  variables:
    PROJECT_LAYOUT: multiple_modules
    GO_MODULE_DIR: ./go-smoke/services/payments
    PYTHON_COVERAGE_VERSION: "7.13.5"
    EXPECT_GO: instrumented
    EXPECT_DDTEST_VERSION: latest
    EXPECT_STDERR: |
      Warning: GO_MODULE_DIR is deprecated and has no effect
      Warning: PYTHON_COVERAGE_VERSION is deprecated and has no effect

# ddtest needs Go 1.25: the script skips Go with a warning.
test_go_124_skip:
  extends: .go_smoke_test
  image: golang:1.24
  variables:
    EXPECT_GO: skipped
    EXPECT_STDERR: "is lower than the Go 1.25.0 that ddtest instrument needs"
